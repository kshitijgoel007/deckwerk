<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' deck: data:; media-src 'self' deck:; style-src 'self' 'unsafe-inline' deck:; script-src 'self'" />
    <title>Speaker View</title>
  </head>
  <body>
    <main>
      <section class="speaker-layout">
        <div class="preview-panel current-panel">
          <div class="panel-heading"><h2>Current slide</h2><div id="position">Slide 1</div></div>
          <div id="current" class="preview"></div>
        </div>
        <aside class="speaker-sidebar">
          <div class="preview-panel next-panel">
            <h2>Next slide</h2>
            <div id="next" class="preview"></div>
          </div>
          <section class="timers" aria-label="Presentation timing">
            <div class="presenter-clock presentation-clock"><span>Presentation elapsed</span><strong id="presentation-timer">00:00</strong></div>
            <div class="presenter-clock slide-clock"><span>Current slide</span><strong id="slide-timer">00:00</strong></div>
            <div class="presenter-clock wall-clock"><span>Local time</span><strong id="wall-clock">--:--</strong></div>
          </section>
        </aside>
      </section>
      <footer><button id="prev">← Previous</button><button id="blank">Blank</button><button id="nextButton">Next →</button><button id="switchDisplays" title="Swap the audience and speaker displays">Switch displays</button><button id="end">End show</button></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
