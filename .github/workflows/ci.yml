# Per-push correctness gate: typecheck + the ordinary and serial suites.
# The browser tier launches real Electron under Xvfb; the preflight in
# scripts/check-test-environment.cjs fails the job if the Electron binary is
# missing rather than letting those suites skip silently green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system dependencies (Electron + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libnss3 libgtk-3-0 libasound2t64
      - run: npm ci
      - name: Configure Electron's SUID sandbox helper
        # Ubuntu 24.04 restricts unprivileged user namespaces, so Electron
        # aborts at launch unless its bundled chrome-sandbox is setuid root.
        # Without this every browser-tier suite times out waiting for a target
        # (and the collab server's HTML preview/apply endpoints 500, since
        # they spawn a measuring browser too).
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Typecheck
        run: npm run typecheck
      - name: Test (ordinary + serial, real Electron under Xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
