  <rect x="232" y="188" width="604" height="604" fill="none" stroke="#565f89" stroke-width="24"/>
  <rect x="196" y="224" width="604" height="604" fill="#1a1b26" stroke="#c0caf5" stroke-width="28"/>

  <text x="498" y="626" fill="#c0caf5" font-family="Monaspace Krypton" font-size="300" font-weight="700" text-anchor="middle">DW</text>
</svg>
