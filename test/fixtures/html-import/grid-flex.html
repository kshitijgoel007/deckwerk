<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;background:#101827;color:#f8fafc;font:32px Inter,sans-serif}
  .slide{box-sizing:border-box;width:1920px;height:1080px;padding:120px;display:grid;grid-template-columns:1.2fr 1fr;gap:64px}
  .copy{display:flex;flex-direction:column;justify-content:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{padding:28px;border:1px solid #334155;border-radius:24px;background:linear-gradient(135deg,#172033,#111827)}
</style></head><body><section class="slide"><div class="copy"><h1>Nested layout</h1><ul><li>Grid</li><li>Flex</li></ul></div><div class="cards"><div class="card">A</div><div class="card">B</div></div></section></body></html>
